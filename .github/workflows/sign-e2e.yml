name: sign-e2e

# Functional test of the ParaSign signing subsystem in real Chromium with a
# WebAuthn virtual authenticator (tests/sign-full.test.mjs). Self-contained: it
# serves frontend/ and stubs /api, so no backend/Redis is needed.
#
# No longer path-gated: this is a required status check, and a skipped check
# never reports, so the pull request would wait on it forever.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

#
# Sharded since 2026-10-17. One job ran everything in 7 to 9.2 minutes against a
# 10-minute timeout, and on 2026-10-17 run 39008721252 on main was cancelled
# three times in "Browser suites", which held the 3.1.6 deploy. The timeout
# stays at 10; the work is split instead. The same file list is cut into
# SHARDS parts by node's own --test-shard, so the set that is tested does not
# change, only where each file runs. The job `sign-e2e` at the bottom keeps the
# name of the required status check and is green only when every shard is.
jobs:
  browser:
    name: browser ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARDS: '4'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install deps (browsers installed separately)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Keyed on the lockfile, so a playwright bump downloads its own Chromium.
      # --with-deps still runs on a hit: the system libraries are not cached.
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run signing functional suite
        if: matrix.shard == 1
        run: node tests/sign-full.test.mjs

      # Every other root suite that drives a browser. They import playwright, so
      # the no-install unit job could never run them, and they were on no other
      # workflow either: cosign appearance and delivery, the developer and user
      # dashboards, the navigation shell, multi-verify and invite delivery had
      # no CI at all. Selected by import, so a new browser suite is picked up
      # here the day it is written. product-heartbeat has its own workflow.
      #
      # Selected by import means anything in tests/ that drives a browser lands
      # here, gate or not. app-shots was a screenshot generator that asserted
      # nothing, and on 2026-09-03 its `page.screenshot: Timeout 30000ms
      # exceeded` took this workflow red on main and blocked the deploy, which
      # needs sign-e2e green in phase 0a. It now lives in scripts/app-shots.mjs
      # with the other generators, so this line did not have to grow an
      # exception. The rule: tests/ is for files that assert something, and a
      # file that only produces artefacts goes in scripts/, browser or not.
      # Same move as the heartbeat canaries in test.yml. See tests/README.md.
      #
      # Selected by scripts/browser-suites.mjs, which walks the imports instead
      # of grepping the first lines of the test file. A suite that reaches
      # playwright through a helper is a browser suite too, and until 2026-09-04
      # it was in neither half: tests/ui-elements-contrast.test.mjs got its
      # browser from scripts/ui-contrast-sweep.mjs, so the grep left it out of
      # this step and handed it to the job that installs no Chromium, where it
      # hung the run rather than failing it.
      #
      # --browser-no-stack, not --browser. A suite that also BOOTS a relay needs
      # this job's opposite: the relay's node_modules, the @paramant/core
      # binding, the admin dependencies and a redis server, none of which this
      # workflow installs and none of which it should. On 2026-09-05
      # koper-hele-weg landed here on the strength of importing playwright and
      # failed nine times over with "Cannot find module admin/node_modules/redis".
      # It runs in relay-crypto-tests, the job that builds a backend. The two
      # lists partition the browser suites, so nothing falls between them.
      #
      # --test-shard cuts the list by position, so every file lands in exactly
      # one shard. The list is computed whole in every shard and only then cut.
      - name: Browser suites
        run: node --test --test-shard="${{ matrix.shard }}/$SHARDS" $(node scripts/browser-suites.mjs --browser-no-stack | grep -vE 'sign-full|product-heartbeat')

  # The required status check is named sign-e2e. This job carries that name, and
  # deploy/deploy-3.1.sh reads the conclusion of the whole workflow run, which is
  # success only when every job is. A cancelled or failed shard makes this red.
  sign-e2e:
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every shard green
        env:
          RESULT: ${{ needs.browser.result }}
        run: |
          echo "browser shards: $RESULT"
          test "$RESULT" = success
