name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # NOTE: sdk-js and sdk-py tests moved to the standalone repo
  # https://github.com/Apolloccrypt/paramant-sdk (with the cross-impl
  # conformance suite). This workflow now covers the relay only.
  shell-syntax:
    name: shell — bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bash syntax check on all .sh files
        run: |
          set -e
          find . -name '*.sh' \
            -not -path './node_modules/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*' \
            -not -path '*/build/*' \
            -not -path '*/dist/*' \
            -print0 \
          | xargs -0 -n1 bash -n
          echo "All shell scripts parse OK."

  undefined-names:
    name: static — every name must exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # The sibling of `bash -n`, for JavaScript. bash -n and node --check both
      # parse; neither resolves names. An hourly setInterval swept a Map that no
      # longer existed and took production down 425 times before anyone looked.
      # Config: eslint.config.mjs, one rule, no style opinions.
      - name: no-undef over the hand-written server code
        run: npx --yes eslint@9 .

  frontend-cache-bust:
    name: frontend — cache-bust guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: All local css/js links must carry a single ?v= cache-bust
        run: scripts/check-cache-bust.sh

  relay-crypto-tests:
    name: relay - crypto suite (@paramant/core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # @paramant/core is the Rust NAPI binding in the sibling paramant-core
      # repo. Until it is published to npm it is a dev file-link, so build it
      # here (as paramant-core's own CI does) to gate the relay crypto suite's
      # byte-compatibility against the binding. Interim until publish.
      - name: Install liboqs build deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev
      # Pin paramant-core to a fixed commit so the crypto byte-compat gate runs
      # against a known revision, not a moving HEAD. Bump this SHA deliberately
      # (and review the diff) when adopting a new paramant-core.
      - name: Build @paramant/core (sibling checkout, pinned)
        env:
          PARAMANT_CORE_SHA: 45a3d3521adda7924692d58be5db60d5b094371f
        run: |
          git clone --no-checkout https://github.com/Apolloccrypt/paramant-core.git "${GITHUB_WORKSPACE}/../paramant-core"
          cd "${GITHUB_WORKSPACE}/../paramant-core"
          git checkout "${PARAMANT_CORE_SHA}"
          rustup show
          cargo build -p paramant-core-node --release
          cp target/release/libparamant_core_node.so crates/paramant-core-node/index.node
      - name: Install relay deps (incl. file-linked @paramant/core)
        working-directory: relay
        run: npm install
      - name: Relay crypto suite
        working-directory: relay
        run: node --test $(find crypto -name '*.test.js')

      # The ParaSign suites that need the ML-DSA-65 engine. They used to run in
      # the unit job below, which installs nothing, so @paramant/core was never
      # there: each one caught the load error, printed "skip - ...", and returned.
      # A file that exits 0 is a PASS to `node --test`, so the job reported
      # "ok 24" while four suites asserted nothing at all. The worst of them was
      # parasign-sandbox-live-guard, the only guard on "a psk_live_ key must
      # never reach the sandbox auto-signer". They run here instead, against the
      # engine this job builds, and test/_requires.js now fails them outright if
      # it is missing. This job has no redis service, so that one precondition is
      # declared by name rather than silently swallowed.
      - name: Relay ParaSign engine suites
        working-directory: relay
        env:
          RELAY_TEST_SKIP: redis
        run: >-
          node --test
          test/parasign-sandbox.test.js
          test/parasign-sandbox-live-guard.test.js
          test/parasign-open-api-e2e.test.js
          test/parasign-envelope-index.test.js

      # inbound-hash-verify spawns a real relay.js, so it needs the installed
      # dependencies and belongs here, not in the no-install unit job. It sat in
      # that job from 2026-07-20 and failed every single run with "relay did not
      # become healthy in time", which is what a missing `redis` module looks
      # like through a spawn with stdio ignored. Thirty red runs in a row on
      # main, and a suite nobody trusts is a suite nobody reads.
      - name: Relay integration suite (needs deps)
        working-directory: relay
        run: node --test test/inbound-hash-verify.test.js

  relay-unit-tests:
    name: relay - unit suite (no native deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # Pure-JS units: account-split schema (keys-table), static-serve, envelope
      # binding, webauthn helpers. No @paramant/core build and no Redis, so the
      # relay/test suite that previously had zero CI coverage now gates here.
      # inbound-hash-verify is excluded: it spawns a real relay.js and needs the
      # installed dependencies, so it runs in the crypto job above. The four
      # parasign-* suites are excluded for the same reason: they need the
      # ML-DSA-65 engine, which this job deliberately does not build. They used
      # to run here and silently skip, which is what made "ok 24" mean nothing.
      # A declared skip is better than a silent one, but it still exits 0 and
      # still shows up as a green check. Two suites assert nothing at all in this
      # job, by name and on purpose, and that is fine as long as it stays two and
      # stays those two. What is not fine is a third joining them quietly, which
      # is exactly how four ParaSign suites came to report "ok" over nothing for
      # weeks. So the skips are counted, named, and held to a list.
      - name: Relay unit suite
        working-directory: relay
        env:
          # This job installs nothing on purpose, so the redis client is absent
          # and parasign-store / parasign-signs-quota cannot reach a server.
          # Declaring it here is what keeps them amber instead of red; anything
          # NOT named here is now a hard failure (see relay/test/_requires.js).
          RELAY_TEST_SKIP: redis
        run: |
          set -o pipefail
          node --test $(ls test/*.test.js | grep -vE \
            'inbound-hash-verify|parasign-sandbox|parasign-open-api-e2e|parasign-envelope-index') \
            2>&1 | tee /tmp/relay-units.log
          # Which suites ran and asserted nothing. The line comes from
          # summary() in test/_requires.js.
          silent=$(grep -oE '^# [a-z0-9-]+: SKIPPED - 0 checks ran' /tmp/relay-units.log \
                   | sed 's/^# //; s/: SKIPPED.*//' | sort)
          # ONE suite, not two. parasign-store also lacks redis here, but it has a
          # memory fallback and still runs three checks, so it is not silent.
          # Measured, not assumed: the first version of this list said two and
          # this gate caught it on the first run.
          expected=$'parasign-signs-quota'
          echo "--- suites that asserted nothing in this job:"
          echo "${silent:-(none)}" | sed 's/^/      /'
          if [ "$silent" != "$expected" ]; then
            echo "::error::the set of suites that assert nothing has changed."
            echo "expected:"; echo "$expected" | sed 's/^/      /'
            echo "got:";      echo "${silent:-(none)}" | sed 's/^/      /'
            echo "A suite that asserts nothing still reports green. If a new one"
            echo "is here, give it its dependency or say why it may stay silent;"
            echo "if one left, remove it from the expected list in test.yml."
            exit 1
          fi

      # Root integration suites (tests/*.mjs): dependency-injected, node builtins
      # only (no @paramant/core, no Redis, no npm install). The browser suites are
      # excluded by what they import, not by a hand-kept list of names: this job
      # installs nothing, so a file importing playwright can only fail here. That
      # list had drifted, and six suites (cosign x2, developer dashboard,
      # navigation shell, multi-verify, invite delivery, user dashboard) were
      # failing on every run because they were never on it. They now run in the
      # sign-e2e workflow, which installs Chromium.
      # Gates the ParaSign open-API conformance suite + key-issuance + pdf-ops that
      # previously ran in no workflow at all.
      - name: Root integration suites (no browser)
        # The canaries are excluded: they talk to the LIVE relay, so they measure
        # production and not this commit, and they run hourly in the
        # product-heartbeat workflow instead. parasign-canary additionally
        # imports @noble/post-quantum to verify the notary signature, and this
        # job installs nothing on purpose, so leaving it in fails the whole step
        # on a missing package before a single assertion runs.
        run: >-
          node --test $(grep -L "from 'playwright'" tests/*.mjs
          | grep -vE 'transfer-canary|parasign-canary')

  admin-unit-tests:
    name: admin - unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Admin unit suite
        working-directory: admin
        run: node --test test/*.test.js

  gitleaks:
    name: secrets - gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Full-history secret scan. The repo-root .gitleaksignore (documented
      # curl/PSS placeholder fingerprints) is honoured automatically. Pinned to a
      # commit SHA, not a moving tag. License-free: Apolloccrypt is a personal
      # account and paramant-relay is public, so gitleaks-action requires no
      # GITLEAKS_LICENSE. Fails the job (and the PR) on any unignored finding.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
