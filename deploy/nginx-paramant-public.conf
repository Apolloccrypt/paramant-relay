server {
    listen 443 ssl;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    server_name relay.paramant.app;
    ssl_certificate /etc/letsencrypt/live/paramant.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paramant.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    location = /v2/sign-dpa {
        limit_req zone=relay_trial burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For '';
        proxy_read_timeout 30s;
    }
    location ~ ^/admin {
        add_header WWW-Authenticate 'Bearer realm="paramant-admin"' always;
        return 401;
    }
    location ~ ^/v2/inbound {
        limit_req zone=relay_inbound burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
    location ~ ^/v2/outbound {
        limit_req zone=relay_outbound burst=10 nodelay;
        limit_req_status 429;
        # Explicit, because the default is 4k (8k on some builds) and that ONE
        # buffer has to hold the whole upstream header block. A download used to
        # answer with 19560 bytes of response headers (the signed delivery
        # receipt rode along in X-Paramant-Receipt), which nginx turns into
        # "upstream sent too big header" and a 502. The relay now hands the
        # receipt over by reference and answers well under 8k, so this is a
        # margin and not a fix: it keeps a future header from silently costing
        # every download, and it covers a relay run with the deprecated
        # PARAMANT_INLINE_RECEIPT_HEADER=1 opt-in still on.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
    location / { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 3600s; }
}
