server {
    listen 127.0.0.1:8080;
    # Compression. Caddy sits in front of this nginx and its config is not in
    # this repo, so the text assets are compressed here. gzip_proxied any:
    # without it nginx skips any request that carries a Via header.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/wasm image/svg+xml text/plain;

    root /home/paramant/app;
    # nginx listens on 127.0.0.1:8080 behind Caddy and the :8443 conf. Any
    # redirect nginx synthesises itself (try_files $uri/ on a directory) would
    # otherwise carry the internal address and port: http://paramant.app:8080/x/.
    # A relative Location keeps it on the public origin. Carried by the server
    # conf since before this file was copied whole; now it is in git.
    absolute_redirect off;
    port_in_redirect off;
    index index.html;
    # Editor and backup leftovers in the docroot (index.html.bak, x.orig, .swp)
    # are never served. Same line as on the server (CT-BACKUP-DENY).
    location ~* \.(bak|bak-[^/]*|old|orig|save|swp|tmp)$ { return 404; }  # CT-BACKUP-DENY
    access_log off;
    # Real client IP: Bunny.net hosts the DNS only and the A record points at
    # this machine, so the request path is client -> Caddy (127.0.0.1) -> here
    # (docs/migration-bunny.md, verified 2 September 2026). The
    # old CF-Connecting-IP header only existed under Cloudflare (removed in the
    # Bunny migration), so it never arrived and every request collapsed to
    # 127.0.0.1 -- turning per-IP rate limits into one global bucket. Trust the
    # local Caddy proxy and take the client IP from the forwarded chain instead.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Security headers — single source of truth (deploy/nginx/snippets/). Also
    # re-included in any location that sets its own add_header (the static-asset
    # block below), because nginx add_header does not inherit once a location
    # defines its own — so CSP/HSTS can never be silently dropped from a response.
    include snippets/paramant-security-headers.conf;
    # HTML and every other non-asset response: cacheable but ALWAYS revalidated
    # (a cheap 304 via ETag), so a new deploy's HTML — nav links, hero CTAs — is
    # visible immediately instead of being served stale from the browser's
    # heuristic cache (root cause of the "ParaRules vanished" / dashboard-button
    # confusion). The versioned static-asset block overrides this with immutable.
    add_header Cache-Control "no-cache" always;

    location = /admin/ {
        alias /home/paramant/app/admin.html;
        default_type text/html;
    }
    location = /admin { return 301 https://$host/admin/; }
    location = /r34ct0r { return 301 https://$host/admin/; }
    location = /r34ct0r.html { return 301 https://$host/admin/; }

    # ── The second admin screen: force-404'd, same as /developer.html ────────
    # /admin/ on the apex is answered by the admin container
    # (paramant-public.conf proxies it to 127.0.0.1:4200), which asks for a
    # session before it renders anything. frontend/admin.html is the OTHER
    # admin screen, the one nothing routes to. The deploy rsyncs the whole of
    # frontend/ into the docroot, so the file is on disk, and the generic
    # `try_files $uri $uri.html` at the bottom of this block handed it to
    # anyone who typed the name: https://paramant.app/admin.html answered 200
    # with the full admin markup and no session asked for.
    # The file is NOT deleted. tests/ui-truthfulness.test.mjs reads both admin
    # screens by name, and a deleted file would make that test unrunnable
    # instead of true. It is 404'd here, exactly the treatment /developer.html
    # gets below: the markup stays in the repo, the URL stops existing.
    # /js/admin.page.js is admin.html's only loader and has no other consumer,
    # so it goes the same way. The exact-match beats the versioned-asset regex
    # location further down, which would otherwise serve it.
    location = /admin.html { return 404; }
    location = /js/admin.page.js { return 404; }

    location = /outlook/taskpane {
        alias /home/paramant/app/outlook/taskpane.html;
        default_type text/html;
        add_header Access-Control-Allow-Origin "https://outlook.office.com" always;
        add_header Access-Control-Allow-Origin "https://outlook.office365.com" always;
    }
    location = /outlook/commands {
        alias /home/paramant/app/outlook/commands.html;
        default_type text/html;
    }
    location = /outlook/manifest.xml {
        alias /home/paramant/app/outlook/manifest.xml;
        default_type application/xml;
    }
    # ── Gated tool routes (Model A): no tool markup served without a valid
    # session. Subrequest hits the existing authUser middleware via
    # /api/user/check (defined below). 401 -> redirect to /auth/login.
    # /verify and /get stay public (recipient path).
    location = /send       { auth_request /api/user/check; error_page 401 = @login_redirect; try_files /send.html       =404; }
    # A /parashare address WITH a ?t= is not the send page: it is a receiving
    # link minted by the Outlook add-in or the browser extension before they
    # pointed at /get. Its receiver has no account, so the gate below sent him
    # to /auth/login and dropped the query, and the file was unreachable. Such
    # links go to the public receiving page instead, query intact. The key is in
    # the #fragment, which the browser never sends; a 302 whose Location has no
    # fragment of its own keeps it (RFC 9110 10.2.2), so it arrives at /get too.
    # The `if` holds only a `return`, the one use of `if` in a location that
    # nginx documents as safe, and it runs in the rewrite phase, before the
    # auth_request of the access phase.
    location = /parashare  { if ($arg_t) { return 302 https://$host/get?$args; } auth_request /api/user/check; error_page 401 = @login_redirect; try_files /parashare.html  =404; }
    # The English copy of the send page (NL | EN, 23-09-2026), behind the same gate.
    location = /en/parashare { if ($arg_t) { return 302 https://$host/en/get?$args; } auth_request /api/user/check; error_page 401 = @login_redirect; try_files /en/parashare.html =404; }
    location = /drop       { auth_request /api/user/check; error_page 401 = @login_redirect; try_files /drop.html       =404; }

    # /ontvang/<token> is the receiving end of a send to named recipients, and
    # it is deliberately NOT gated. Whoever opens it has a link from their own
    # mail and nothing else: a recipient is somebody who was sent something, not
    # somebody who has to register first. The proof happens on the page itself,
    # where a code goes to the same mailbox the invitation went to.
    #
    # ^~ so every token under it lands on the same page, and noindex because a
    # token in a search result is a token in somebody else's hands.
    location ^~ /ontvang/ {
        # The include is NOT optional. nginx add_header does not inherit into a
        # location that sets any add_header of its own, so the X-Robots-Tag
        # below silently dropped CSP, X-Frame-Options, nosniff, Referrer-Policy
        # and Permissions-Policy -- on the one page whose URL IS the secret and
        # which must never be framed or leak a referrer. The snippet's own
        # header says this in as many words.
        include snippets/paramant-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /ophalen.html =404;
    }
    # The English receiving page. A send made from the English page links here;
    # every older mail keeps pointing at /ontvang/ above, and that stays Dutch
    # with a switch to this one. Same headers, same noindex, same reasons.
    location ^~ /en/ontvang/ {
        include snippets/paramant-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /en/ophalen.html =404;
    }
    # /sign is NOT gated, deliberately, and it is the only one of these four
    # that is not. It sits in sitemap.xml, so the gate sent Googlebot to
    # /auth/login, and robots.txt disallows /auth/. The crawler was invited to a
    # page, redirected to a directory it is forbidden to read, and the title it
    # saw was "302 Found": the signing page could not enter the index at all.
    # Not an argument about visitor numbers. The traffic that reached /sign in
    # this window does not survive inspection: 31 of the 36 non-bot IPs fetched
    # no CSS, JS, font or favicon at all, while carrying a referer they never
    # earned, so they are scanners wearing a browser string. The reason to serve
    # the page is the cycle above, which blocks indexing whether or not anyone
    # is knocking.
    #
    # Serving the page costs nothing that was protected. sign.html holds no
    # customer data: it is a client-side tool that asks the API for everything
    # it shows, and every one of those API calls carries its own authUser gate.
    # A visitor without a session now sees what the product does and what it
    # needs, instead of a login form for an account he has no reason to want yet.
    location = /sign       { try_files /sign.html =404; }
    # Hardcoded https:// because nginx listens on 127.0.0.1:8080 behind
    # Caddy; a bare /path redirect makes nginx synthesize an absolute URL
    # with the internal :8080 port, which is unreachable from outside.
    # An English page sends a visitor without a session to the English login
    # (fase 2 SITE-05-A-en): /en/parashare used to land on "Welkom terug.".
    location @login_redirect {
        if ($uri ~ ^/en(/|$)) { return 302 https://$host/en/auth/login?next=$uri; }
        return 302 https://$host/auth/login?next=$uri;
    }

    # ── Developer dashboard: gated AND hidden ───────────────────────────────
    # auth_request /api/user/developer/check returns:
    #   200  allowlisted developer   -> serve /developer.html
    #   401  no session              -> @login_redirect
    #   403  logged in, not a dev    -> remap to 404 (@developer_hidden) so a
    #                                   logged-in non-developer cannot tell the
    #                                   page exists.
    # /developer.html is force-404'd so the static file can only be reached
    # through the gated /developer route, never directly.
    location = /developer {
        auth_request /api/user/developer/check;
        error_page 401 = @login_redirect;
        error_page 403 = @developer_hidden;
        try_files /developer.html =404;
    }
    location = /developer.html { return 404; }
    location @developer_hidden { return 404; }

    location = /signup { try_files /signup.html =404; }
    location = /signup/verified { try_files /signup/verified.html =404; }
    location = /account { try_files /account.html =404; }
    location /billing/checkout/ { try_files /billing/checkout.html =404; }
    location = /auth/login { try_files /auth/login.html =404; }
    location = /auth/backup { try_files /auth/backup.html =404; }
    location /auth/setup/ { try_files /auth/setup.html =404; }
    location = /auth/request-reset { try_files /auth/request-reset.html =404; }
    location /auth/reset-confirm/ { try_files /auth/reset-confirm.html =404; }
    # The English copies of the sign-in and account pages (23-09-2026). The pages
    # without a token are found by the catch-all ($uri.html); these three carry
    # a path segment after the page name and need the same mapping as above.
    location /en/billing/checkout/ { try_files /en/billing/checkout.html =404; }
    location /en/auth/setup/ { try_files /en/auth/setup.html =404; }
    location /en/auth/reset-confirm/ { try_files /en/auth/reset-confirm.html =404; }
    location = /help { try_files /help/index.html =404; }
    # The English copies of the four Dutch pages live under /en/ (23-09-2026).
    # /en itself is the English homepage, served the way /help is.
    location = /en { try_files /en/index.html =404; }
    # /en/help is the English help index, served the way /help is.
    location = /en/help { try_files /en/help/index.html =404; }
    location = /security { try_files /security.html =404; }
    location = /pentest-report-2026-04-08.txt { return 301 /security; }
    # /pararules became /rules in the two-product-names round (snoei 2026-09).
    # The old path is indexed, so the 301 is permanent: it is not a migration
    # step that gets tidied away later.
    location = /pararules { return 301 https://$host/rules; }
    location = /license { try_files /license.html =404; }
    location /api/captcha/ {
        proxy_pass http://127.0.0.1:4200/admin/api/captcha/;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4k;
    }

    # Internal-only session-validity probe used by auth_request on gated
    # tool routes above. Placed before the broader /api/user/ block so the
    # exact-match wins. No login-rate-limit (this fires per page load, not
    # per login attempt) and no body forwarding (GET only).
    location = /api/user/check {
        internal;
        proxy_pass http://127.0.0.1:4200/admin/api/user/check;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = /api/user/developer/check {
        internal;
        proxy_pass http://127.0.0.1:4200/admin/api/user/developer/check;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # /api/user/ is two kinds of traffic, and they get two limits.
    #
    # The doors where a password, a TOTP code or a new account is tried (login,
    # backup-code login, passkey login, signup, the setup link, TOTP reset and
    # the backup-code regeneration) stay in relay_auth: 10 a minute per IP,
    # burst 5. That is the brute-force brake and it is meant to bite.
    #
    # Everything else under /api/user/ is a signed-in person reading their own
    # account. It used to sit in that same zone, and one load of /account fires
    # about nine requests (session check, me, keys, passkeys, signing keys,
    # quota ...), so the sixth to ninth came back 429 and the page said "HTTP
    # 429". Dashboard, account and /sign inside one minute, or an office behind
    # one address, locked people out of their own screens. Those reads are
    # behind a session cookie that admin/server.js checks on every call, so they
    # get user_session: 1200 a minute per IP, burst 120. Per IP and never per
    # cookie, because the cookie is the client's choice (review #555, H1).
    #
    # The two sign-in doors (password+TOTP login and the passkey login) get
    # relay_login instead: 30 a minute per IP, burst 30. At 10 an office behind
    # one NAT address got 429 at 9:00 (herreview #560, N3). Guessing is braked
    # per IP on failures and per account behind nginx, in admin.
    #
    # Prefix locations, longest match wins, so /api/user/login-with-backup lands
    # in the /api/user/login block. tests/nginx-user-limits.test.mjs holds the
    # split, in this file and in the self-host conf.
    location /api/user/login {
        limit_req        zone=relay_login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4200/admin/api/user/login;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 64k;
    }
    location /api/user/signup {
        limit_req        zone=relay_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4200/admin/api/user/signup;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 64k;
    }
    location /api/user/setup/ {
        limit_req        zone=relay_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4200/admin/api/user/setup/;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 64k;
    }
    location /api/user/auth/webauthn/login/ {
        limit_req        zone=relay_login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4200/admin/api/user/auth/webauthn/login/;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 64k;
    }
    location /api/user/auth/ {
        limit_req        zone=relay_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4200/admin/api/user/auth/;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 64k;
    }
    location /api/user/account/totp/ {
        limit_req        zone=relay_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4200/admin/api/user/account/totp/;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 64k;
    }
    location /api/user/account/backup-codes/ {
        limit_req        zone=relay_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4200/admin/api/user/account/backup-codes/;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 64k;
    }
    # The document capsule is not JSON: POST /api/user/envelopes/<id>/document
    # takes up to 6m (express.raw in admin/server.js; the app says 5 MB), and the
    # 64k of the blocks around it answered 413 at nginx before node saw a byte.
    # A regex location is matched before any prefix location, so this one wins
    # over /api/user/ without moving it; the capture lets proxy_pass keep a URI.
    # deploy-3.1.sh phase 5c used to insert this block on the server by hand, and
    # still recognises it by the location line below, so it never inserts twice.
    location ~ ^/api/user/(envelopes/[^/]+/document)$ {
        limit_req        zone=relay_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4200/admin/api/user/$1;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 6m;
    }
    location /api/user/ {
        limit_req        zone=user_session burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4200/admin/api/user/;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 64k;
    }
        location = /api/check-key {
        proxy_pass http://127.0.0.1:3001/v2/check-key;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header Host $host;
    }
    location = /api/request-key {
        proxy_pass http://127.0.0.1:4200/admin/api/request-key;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 16k;
    }
    location = /request-key { try_files /request-key.html =404; }
    location = /verwerkersovereenkomst { try_files /verwerkersovereenkomst.html =404; }
    location = /api/sign-dpa {
        limit_req        zone=api burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000/v2/sign-dpa;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For '';
        client_max_body_size 16k;
    }
    location = /status         { try_files /status.html =404; }
    location = /crypto-agility { try_files /crypto-agility.html =404; }
    location = /sla         { try_files /sla.html =404; }
location = /users.json { deny all; return 404; }    location ~ /.env { deny all; return 404; }    location ~ /.git { deny all; return 404; }

    # Long-lived cache for VERSIONED static assets (links carry ?v=N — enforced by
    # scripts/check-cache-bust.sh). immutable = the browser never revalidates;
    # safe ONLY because a content change ships under a new ?v= URL. Re-includes the
    # security headers (this location sets its own add_header, which would
    # otherwise drop the server-level set). Single Cache-Control now: the old
    # `expires 1y` emitted a second, redundant Cache-Control header.
    location ~* \.(css|js|woff2|woff|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        include snippets/paramant-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
    # An unknown English address gets the English 404 with the English bar
    # (fase 2 SITE-03-F*), not the Dutch one.
    location /en/ {
        error_page 404 /en/404.html;
        try_files $uri $uri.html $uri/ =404;
    }
    location = /en/404.html { internal; }
    # /dicom info page removed (snoei 2026-09), and the /dicom/ gateway with
    # the :8090 server block behind it retired (H2, 2026-10): its upstream,
    # paramant-ghost-pipe.fly.dev, no longer resolves, so every request there was
    # a 502, and it sent imaging data outside the EEA via Google DNS. The server
    # had already dropped both by hand; this file now says the same. /dicom/...
    # falls through to the docroot and answers its 404 like any unknown address.
    location = /dicom { return 404; }

    # Admin panel API proxy (same-origin, geen CORS issues)
    location /rp/health/ {
        client_max_body_size 30M;
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_http_version 1.1;
        proxy_set_header Host health.paramant.app;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Admin-Token $http_x_admin_token;
    }
    location /rp/legal/ {
        proxy_pass http://127.0.0.1:3003/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_http_version 1.1;
        proxy_set_header Host legal.paramant.app;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Admin-Token $http_x_admin_token;
    }
    location /rp/finance/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_http_version 1.1;
        proxy_set_header Host finance.paramant.app;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Admin-Token $http_x_admin_token;
    }
    location /rp/iot/ {
        proxy_pass http://127.0.0.1:3004/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_http_version 1.1;
        proxy_set_header Host iot.paramant.app;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Admin-Token $http_x_admin_token;
    }
    # Removed (sec/infra-hardening): the /rp/fly/ block forwarded X-Admin-Token +
    # X-Api-Key to paramant-ghost-pipe.fly.dev over an UNVERIFIED TLS connection
    # (no proxy_ssl_verify) resolving via public DNS — an on-path/DNS-poison
    # attacker could harvest the admin token. It had no live callers (already gone
    # from CSP connect-src). The :8090 Fly server block and the /dicom/ gateway
    # followed in 2026-10 (H2): the Fly host is gone, see the /dicom note above.


}

server {
    listen 127.0.0.1:8081;
    # Same as the :8080 block: Caddy on 127.0.0.1 is in front, so without these
    # $remote_addr is 127.0.0.1 for every visitor and the relay's per-IP limits
    # (envelope open, verify, sign) become one bucket for everybody (sweep-chaos 6).
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Compression. Caddy sits in front of this nginx and its config is not in
    # this repo, so the text assets are compressed here. gzip_proxied any:
    # without it nginx skips any request that carries a Via header.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/wasm image/svg+xml text/plain;

    access_log off;

    location = /outlook/taskpane {
        alias /home/paramant/app/outlook/taskpane.html;
        default_type text/html;
        add_header Access-Control-Allow-Origin "https://outlook.office.com" always;
        add_header Access-Control-Allow-Origin "https://outlook.office365.com" always;
    }
    location = /outlook/commands {
        alias /home/paramant/app/outlook/commands.html;
        default_type text/html;
    }
    location = /outlook/manifest.xml {
        alias /home/paramant/app/outlook/manifest.xml;
        default_type application/xml;
    }
location = /users.json { deny all; return 404; }    location ~ /.env { deny all; return 404; }    location ~ /.git { deny all; return 404; }
    location / {
        # One padded block base64'd in a JSON envelope, with room to spare. A file
        # is never one request: 500 MB travels as a run of 5 MiB blocks.
        client_max_body_size 12M;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For '';
        proxy_read_timeout 3600s;
    }
}

server {
    listen 127.0.0.1:8086;
    # Same as the :8080 block: Caddy on 127.0.0.1 is in front, so without these
    # $remote_addr is 127.0.0.1 for every visitor and the relay's per-IP limits
    # (envelope open, verify, sign) become one bucket for everybody (sweep-chaos 6).
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Compression. Caddy sits in front of this nginx and its config is not in
    # this repo, so the text assets are compressed here. gzip_proxied any:
    # without it nginx skips any request that carries a Via header.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/wasm image/svg+xml text/plain;

    root /home/paramant/app-legal;
    index index.html;
    access_log off;
    # Bound the bulk-upload body and rate the catch-all relay path. Without these
    # the :8086 /v2/ catch-all accepted an unbounded body and unthrottled request
    # rate (the per-endpoint blocks above only cover specific /v2/* paths). 35M
    # mirrors the self-host hardening; the `api` zone is already declared in the
    # main nginx.conf http{} (reused at the /v2/sign-dpa block above).
    location /v2/ {
        client_max_body_size 35M;
        limit_req        zone=api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Auth "";
        proxy_set_header X-Paramant-Client-IP "";
        proxy_set_header X-Verified-Email-Hash "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 3600s;
    }
    location /health { proxy_pass http://127.0.0.1:3002; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Internal-Auth ""; proxy_set_header X-Paramant-Client-IP ""; proxy_set_header X-Verified-Email-Hash ""; }
    location /admin/ { proxy_pass http://127.0.0.1:3002; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Internal-Auth ""; proxy_set_header X-Paramant-Client-IP ""; proxy_set_header X-Verified-Email-Hash ""; }

    location = /outlook/taskpane {
        alias /home/paramant/app/outlook/taskpane.html;
        default_type text/html;
        add_header Access-Control-Allow-Origin "https://outlook.office.com" always;
        add_header Access-Control-Allow-Origin "https://outlook.office365.com" always;
    }
    location = /outlook/commands {
        alias /home/paramant/app/outlook/commands.html;
        default_type text/html;
    }
    location = /outlook/manifest.xml {
        alias /home/paramant/app/outlook/manifest.xml;
        default_type application/xml;
    }
location = /users.json { deny all; return 404; }    location ~ /.env { deny all; return 404; }    location ~ /.git { deny all; return 404; }
    location / { try_files $uri $uri.html /index.html; }
}

