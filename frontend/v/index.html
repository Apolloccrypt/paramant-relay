<meta name="referrer" content="no-referrer">
<title>Stukken sturen &middot; Paramant</title>

  office and has no account. Every file is locked on this phone, to the office's
  key, before anything leaves it; the hash in the #fragment proves the key is the
  one the office made (js/opvragen-kern.js, relay/lib/opvraag.js).
-->

</head>

<div class="app">
  <section id="v-laden" class="body"><p class="say">Even laden&hellip;</p></section>

  <section id="v-stop" class="body" hidden>
    <div class="stop"><h1 id="stop-title"></h1><p id="stop-text"></p></div>
  </section>

  <section id="v-form" class="body" hidden>
    <div class="from" style="margin-top:20px">
      <div class="ov-logo" id="logo"></div>
      <div><div class="who">Van</div><div class="name" id="office"></div></div>
    </div>
    <p class="intro" id="intro"></p>
    <div id="reqs"></div>
    <div class="calm"><svg width="20" height="20"><use href="#i-lock"/></svg><span id="calm"></span></div>
    <button class="ov-btn primary" id="send" type="button" disabled>Versturen</button>
    <p class="say err" id="send-err" role="alert" hidden></p>
    <div class="foot" id="foot"></div>
  </section>

  <section id="v-done" class="done-wrap" hidden>
    <svg class="ill" width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
      <circle class="il-disc" cx="66" cy="66" r="64"/>
      <path class="il-doc" d="M40 34h34l18 18v46a3 3 0 0 1-3 3H40a3 3 0 0 1-3-3V37a3 3 0 0 1 3-3z" stroke-width="2.2" stroke-linejoin="round"/>
      <path class="il-doc" d="M74 34v18h18" fill="none" stroke-width="2.2" stroke-linejoin="round"/>
      <path class="il-line" d="M47 52h18M47 61h28M47 70h22" stroke-width="2.2" stroke-linecap="round"/>
      <rect class="il-lock" x="70" y="76" width="30" height="24" rx="5"/>
      <path class="il-shackle" d="M77 76v-5a8 8 0 0 1 16 0v5" fill="none" stroke-width="3.2" stroke-linecap="round"/>
      <circle class="il-hole" cx="85" cy="86" r="2.6"/><path class="il-holel" d="M85 87.5v4.5" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <h1>Verstuurd.</h1>
    <p class="lead" id="done-lead"></p>
    <div class="group receipt" id="receipt"></div>
    <p class="sm">Je kunt dit scherm nu sluiten.</p>
    <div class="sent-by"><svg width="16" height="16"><use href="#i-mark"/></svg>Verstuurd met Paramant</div>
  </section>
</div>
<script type="module" src="/js/opvragen-klant.page.js?v=1"></script>
</body>
</html>
