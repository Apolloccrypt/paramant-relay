<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset authenticator — Paramant</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0B3A6A">
<link rel="stylesheet" href="/design-system.css?v=19">
<link rel="stylesheet" href="/nav.css?v=16">
<link rel="stylesheet" href="/relay-pulse.css?v=1">
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo" aria-label="Paramant"><img src="/favicon-32.png" alt="" class="nav-logo-mark">aramant</a>

  <ul class="nav-links">
    <li><a href="/parashare" class="nav-link">Send</a></li>
    <li><a href="/sign" class="nav-link">Sign</a></li>
    <li><a href="/verify" class="nav-link">Verify</a></li>
    <li><a href="/docs" class="nav-link">Docs</a></li>
  </ul>

  <div class="nav-right">
    <a href="/pricing" class="nav-link nav-pricing">Pricing</a>
    <div class="nav-auth" id="nav-auth">
      <a href="/auth/login" class="nav-signin">Sign in</a>
      <a href="/signup" class="nav-cta">Create account</a>
    </div>
  </div>

  <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-mobile" id="nav-mobile">
  <a href="/parashare" class="nav-mobile-standalone">Send</a>
  <a href="/sign" class="nav-mobile-standalone">Sign</a>
  <a href="/verify" class="nav-mobile-standalone">Verify</a>
  <a href="/docs" class="nav-mobile-standalone">Docs</a>
  <a href="/pricing" class="nav-mobile-standalone">Pricing</a>
  <a href="/auth/login" class="nav-mobile-standalone">Sign in</a>
  <a href="/signup" class="nav-mobile-standalone">Create account</a>
  <a href="/help" class="nav-mobile-standalone">Help</a>
</div>

<main class="page-main">
<section class="form-section">
  <h1 class="form-title">Reset authenticator</h1>
  <p class="form-subtitle">Enter your account email. If we find a matching account, we will send you a link to set up a new authenticator.</p>

  <form id="reset-form" class="form-card">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" required autocomplete="username" autofocus>

    <button type="submit" class="btn btn-primary mt-3" id="submit-btn">
      Send reset link
    </button>

    <div id="error" class="error"></div>
    <div id="success" class="success" style="display:none"></div>
  </form>

  <p class="footer-text mt-4">
    Back to <a href="/auth/login">sign in</a>
  </p>
</section>
</main>

<script src="/js/pow-captcha.js?v=1"></script>
<script src="/nav.js?v=12" defer></script>
<script src="/js/nav-auth.js" defer></script>
<script src="/js/auth-request-reset.js?v=1"></script>
</body>
</html>
